# kitespan's site: on a push to main and by hand, the landing page and its demo built from this tree
# (scripts/build-site.ts), checked in headless Chrome (scripts/site-check.ts: no request off the site, the demo's
# scenes, no console error), then deployed to GitHub Pages. Never a model turn, a credential, a secret or the real
# claude. Every action is pinned by its commit, with its tag after it. test/unit/workflows.test.ts checks this file.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits behind the one that runs and is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHROME_PATH: /usr/bin/google-chrome # the runner's own Chrome: nothing is downloaded
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --omit=optional
      - run: bun scripts/build-site.ts --out "$RUNNER_TEMP/site"
      - run: bun scripts/site-check.ts --site "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/site-check" --port 7941
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-check
          path: ${{ runner.temp }}/site-check
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
